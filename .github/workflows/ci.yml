# Έλεγχοι σε κάθε push / pull request (GitHub Actions — δωρεάν για τέτοια χρήση)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Χειροκίνητη εκτέλεση από το GitHub (Actions → CI → Run workflow) ή με `gh workflow run CI`
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (shared, api, mobile)
        run: npm run typecheck
      - name: Tests (αλγόριθμος, API, φρένο κόστους)
        run: npm test
      - name: DB tests (migrations, RLS, push, διαγραφή λογαριασμού)
        run: npm run test:db
      - name: Bundle εφαρμογής (Android)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/expo-export
        env:
          CI: 1
      - name: Docker image του API
        run: docker build -t centimeet-api:ci .
